<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Security Hardening Checklist Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e6ff;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #73e9e97a, #7cc0d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #a0a8d8;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(115, 233, 233, 0.2);
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            color: #a0a8d8;
            margin-bottom: 0.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="text"] {
            padding: 0.75rem;
            border: 1px solid rgba(115, 233, 233, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #e0e6ff;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #73e9e97a;
            background: rgba(115, 233, 233, 0.1);
            box-shadow: 0 0 0 3px rgba(115, 233, 233, 0.1);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(115, 233, 233, 0.4);
            background: rgba(115, 233, 233, 0.1);
            color: #73e9e97a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(115, 233, 233, 0.2);
            border-color: #73e9e97a;
        }

        button.active {
            background: #73e9e97a;
            color: #0a0e27;
            border-color: #73e9e97a;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(115, 233, 233, 0.1);
            border: 1px solid rgba(115, 233, 233, 0.3);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #73e9e97a, #7cc0d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #a0a8d8;
            margin-top: 0.5rem;
        }

        .checklist-container {
            display: grid;
            gap: 1rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .category-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(115, 233, 233, 0.2);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .category-header {
            padding: 1.25rem;
            background: linear-gradient(135deg, rgba(115, 233, 233, 0.15), rgba(124, 192, 212, 0.1));
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid rgba(115, 233, 233, 0.2);
        }

        .category-header:hover {
            background: linear-gradient(135deg, rgba(115, 233, 233, 0.2), rgba(124, 192, 212, 0.15));
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
        }

        .category-icon {
            font-size: 1.3rem;
            color: #73e9e97a;
        }

        .category-count {
            font-size: 0.85rem;
            color: #a0a8d8;
            background: rgba(115, 233, 233, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            margin: 0 0.75rem;
        }

        .toggle-icon {
            font-size: 1rem;
            color: #73e9e97a;
            transition: transform 0.3s ease;
        }

        .category-section.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .checklist-items {
            padding: 1rem;
            background: rgba(10, 14, 39, 0.5);
            display: none;
        }

        .category-section.expanded .checklist-items {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checklist-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(115, 233, 233, 0.1);
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .checklist-item:hover {
            background: rgba(115, 233, 233, 0.08);
            border-color: rgba(115, 233, 233, 0.3);
        }

        .checklist-item.completed {
            background: rgba(115, 233, 233, 0.1);
            border-color: rgba(115, 233, 233, 0.4);
        }

        .item-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #73e9e97a;
        }

        .item-title {
            font-weight: 600;
            color: #e0e6ff;
            flex: 1;
        }

        .item-toggle {
            cursor: pointer;
            color: #a0a8d8;
            transition: transform 0.3s ease;
            font-size: 1rem;
        }

        .item-toggle.active {
            transform: rotate(180deg);
            color: #73e9e97a;
        }

        .item-details {
            display: none;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(115, 233, 233, 0.15);
        }

        .item-details.visible {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .detail-block {
            font-size: 0.85rem;
        }

        .detail-label {
            color: #a0a8d8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 0.3rem;
            font-size: 0.75rem;
        }

        .detail-value {
            color: #e0e6ff;
        }

        .difficulty-low {
            color: #4ade80;
        }

        .difficulty-medium {
            color: #fbbf24;
        }

        .difficulty-high {
            color: #f87171;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge-low {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .badge-medium {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .badge-high {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .resource-link {
            color: #73e9e97a;
            text-decoration: none;
            border-bottom: 1px dotted rgba(115, 233, 233, 0.5);
            transition: all 0.2s ease;
        }

        .resource-link:hover {
            color: #7cc0d4;
            border-bottom-color: #7cc0d4;
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.85rem 1.75rem;
            background: linear-gradient(135deg, rgba(115, 233, 233, 0.2), rgba(124, 192, 212, 0.1));
            border: 1px solid rgba(115, 233, 233, 0.4);
            color: #73e9e97a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, rgba(115, 233, 233, 0.3), rgba(124, 192, 212, 0.2));
            border-color: #73e9e97a;
            box-shadow: 0 0 20px rgba(115, 233, 233, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #a0a8d8;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(115, 233, 233, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #73e9e97a, #7cc0d4);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }

            .item-details.visible {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1> CNC Security Hardening Checklist
            </h1>
            <p class="subtitle">Manufacturing Security Expert | OT/IT Security Framework</p>
            <p style="color: #7cc0d4; font-size: 0.9rem;">Comprehensive hardening guide for CNC systems and manufacturing facilities</p>
        </header>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="categoryFilter">Filter by Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="network">Network & Segmentation</option>
                    <option value="authentication">Authentication & Access</option>
                    <option value="perimeter">Perimeter Protection</option>
                    <option value="endpoint">Endpoint Security</option>
                    <option value="data">Data Protection</option>
                    <option value="physical">Physical Security</option>
                    <option value="incident">Incident Response</option>
                    <option value="compliance">Compliance</option>
                    <option value="backup">Backup & Recovery</option>
                    <option value="supply">Supply Chain</option>
                </select>
            </div>

            <div class="control-group">
                <label for="difficultyFilter">Difficulty Level</label>
                <select id="difficultyFilter">
                    <option value="">All Levels</option>
                    <option value="low">Low Complexity</option>
                    <option value="medium">Medium Complexity</option>
                    <option value="high">High Complexity</option>
                </select>
            </div>

            <div class="control-group">
                <label for="searchInput">Search Items</label>
                <input type="text" id="searchInput" placeholder="Search by keyword...">
            </div>

            <div class="control-group">
                <label>Quick Actions</label>
                <div class="button-group">
                    <button onclick="expandAll()">Expand All</button>
                    <button onclick="collapseAll()">Collapse All</button>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalItems">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedItems">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completionPercent">0%</div>
                <div class="stat-label">Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="remainingItems">0</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <div class="checklist-container" id="checklistContainer"></div>

        <div class="action-buttons">
            <button class="action-btn" onclick="resetProgress()">
                <i class="fas fa-redo"></i> Reset Progress
            </button>
            <button class="action-btn" onclick="exportAsText()">
                <i class="fas fa-download"></i> Export Checklist
            </button>
            <button class="action-btn" onclick="window.print()">
                <i class="fas fa-print"></i> Print Checklist
            </button>
        </div>
    </div>

        let checklistState = {};
        const STORAGE_KEY = 'cnc-hardening-checklist';

        function initializeChecklist() {
            loadProgress();
            renderChecklist();
            updateStats();

            document.getElementById('categoryFilter').addEventListener('change', filterChecklist);
            document.getElementById('difficultyFilter').addEventListener('change', filterChecklist);
            document.getElementById('searchInput').addEventListener('input', filterChecklist);
        }

        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';

            checklistData.forEach((category, categoryIndex) => {
                const section = document.createElement('div');
                section.className = 'category-section expanded';
                section.id = `category-${categoryIndex}`;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.onclick = () => toggleCategory(categoryIndex);

                const categoryCompleted = category.items.filter(item => checklistState[getItemId(categoryIndex, item.title)]).length;
                const categoryTotal = category.items.length;

                header.innerHTML = `
                    <div class="category-title">
                        <i class="${category.icon} category-icon"></i>
                        <span>${category.title}</span>
                        <span class="category-count">${categoryCompleted}/${categoryTotal}</span>
                    </div>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                `;

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'checklist-items';

                category.items.forEach((item, itemIndex) => {
                    const itemEl = createChecklistItem(categoryIndex, item, itemIndex);
                    itemsDiv.appendChild(itemEl);
                });

                section.appendChild(header);
                section.appendChild(itemsDiv);
                container.appendChild(section);
            });
        }

        function createChecklistItem(categoryIndex, item, itemIndex) {
            const itemId = getItemId(categoryIndex, item.title);
            const isCompleted = checklistState[itemId] || false;

            const itemEl = document.createElement('div');
            itemEl.className = `checklist-item ${isCompleted ? 'completed' : ''}`;

            const difficultyClass = `difficulty-${item.difficulty}`;
            const badgeClass = `badge badge-${item.difficulty}`;

            itemEl.innerHTML = `
                <div class="item-header">
                    <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleItem(${categoryIndex}, '${item.title.replace(/'/g, "\\'")}')">
                    <span class="item-title">${item.title}</span>
                    <span class="item-toggle" onclick="toggleDetails(this)"><i class="fas fa-chevron-down"></i></span>
                </div>
                <div class="item-details">
                    <div class="detail-block">
                        <div class="detail-label">Description</div>
                        <div class="detail-value">${item.description}</div>
                    </div>
                    <div class="detail-block">
                        <div class="detail-label">Difficulty</div>
                        <div class="detail-value"><span class="badge ${badgeClass}">${item.difficulty.charAt(0).toUpperCase() + item.difficulty.slice(1)}</span></div>
                    </div>
                    <div class="detail-block">
                        <div class="detail-label">Time to Implement</div>
                        <div class="detail-value">${item.time}</div>
                    </div>
                    <div class="detail-block">
                        <div class="detail-label">Resource Cost</div>
                        <div class="detail-value"><span class="badge ${badgeClass}">${item.cost}</span></div>
                    </div>
                    <div class="detail-block">
                        <div class="detail-label">Tools & Resources</div>
                        <div class="detail-value">
                            ${item.tools.map(t => `<div>• ${t}</div>`).join('')}
                            ${item.resources.map(r => `<div>• <a href="#" class="resource-link">${r}</a></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;

            return itemEl;
        }

        function toggleItem(categoryIndex, title) {
            const itemId = getItemId(categoryIndex, title);
            checklistState[itemId] = !checklistState[itemId];
            saveProgress();
            updateStats();
            renderChecklist();
        }

        function toggleDetails(element) {
            const details = element.parentElement.nextElementSibling;
            details.classList.toggle('visible');
            element.classList.toggle('active');
        }

        function toggleCategory(categoryIndex) {
            const section = document.getElementById(`category-${categoryIndex}`);
            section.classList.toggle('expanded');
            section.classList.toggle('collapsed');
        }

        function getItemId(categoryIndex, title) {
            return `item-${categoryIndex}-${title}`;
        }

        function updateStats() {
            let totalItems = 0;
            let completedItems = 0;

            checklistData.forEach(category => {
                category.items.forEach(item => {
                    totalItems++;
                    const itemId = getItemId(checklistData.indexOf(category), item.title);
                    if (checklistState[itemId]) completedItems++;
                });
            });

            const percentage = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('completedItems').textContent = completedItems;
            document.getElementById('remainingItems').textContent = totalItems - completedItems;
            document.getElementById('completionPercent').textContent = percentage + '%';
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(checklistState));
        }

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                checklistState = JSON.parse(saved);
            }
        }

        function resetProgress() {
            if (confirm('Are you sure? This will reset all progress.')) {
                checklistState = {};
                saveProgress();
                renderChecklist();
                updateStats();
            }
        }

        function expandAll() {
            document.querySelectorAll('.category-section').forEach(section => {
                section.classList.add('expanded');
                section.classList.remove('collapsed');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.category-section').forEach(section => {
                section.classList.remove('expanded');
                section.classList.add('collapsed');
            });
        }

        function filterChecklist() {
            const categoryFilter = document.getElementById('categoryFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            document.querySelectorAll('.category-section').forEach((section, categoryIndex) => {
                const category = checklistData[categoryIndex];
                let hasVisibleItems = false;

                const items = section.querySelectorAll('.checklist-item');
                items.forEach((itemEl, itemIndex) => {
                    const item = category.items[itemIndex];
                    let show = true;

                    if (categoryFilter && category.category !== categoryFilter) show = false;
                    if (difficultyFilter && item.difficulty !== difficultyFilter) show = false;
                    if (searchTerm && !item.title.toLowerCase().includes(searchTerm) &&
                        !item.description.toLowerCase().includes(searchTerm)) show = false;

                    itemEl.style.display = show ? 'block' : 'none';
                    if (show) hasVisibleItems = true;
                });

                section.style.display = hasVisibleItems ? 'block' : 'none';
            });
        }

        function exportAsText() {
            let text = 'CNC SECURITY HARDENING CHECKLIST\n';
            text += 'Manufacturing Security Expert - OT/IT Security Framework\n';
            text += '='.repeat(70) + '\n\n';

            checklistData.forEach((category, categoryIndex) => {
                text += `\n${category.title.toUpperCase()}\n`;
                text += '-'.repeat(70) + '\n';

                category.items.forEach((item, itemIndex) => {
                    const itemId = getItemId(categoryIndex, item.title);
                    const isCompleted = checklistState[itemId] ? '[✓]' : '[ ]';

                    text += `${isCompleted} ${item.title}\n`;
                    text += `   Description: ${item.description}\n`;
                    text += `   Difficulty: ${item.difficulty} | Time: ${item.time} | Cost: ${item.cost}\n`;
                    text += `   Tools: ${item.tools.join(', ')}\n`;
                    text += `\n`;
                });
            });

            const blob = new Blob([text], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cnc-hardening-checklist.txt';
            a.click();
        }

        initializeChecklist();
    </script>
